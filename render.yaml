services:
  - type: web
    name: claim-check
    runtime: python
    plan: free
    branch: otari-hackathon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OTARI_BASE_URL
        value: https://eu.api.otari.ai/api/v1
      - key: OTARI_API_KEY
        sync: false
      - key: VOLUNTEER_KEY_ALICE
        sync: false
      - key: VOLUNTEER_KEY_BOB
        sync: false
      - key: GUARD_TOKEN
        generateValue: true
      - key: PUBLIC_URL
        sync: false
