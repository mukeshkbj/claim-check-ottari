# Render's free tier sleeps after ~15 minutes idle, so the first visitor waits ~50 s.
# During judging, ping the health check every 10 minutes so the demo is awake. Disabled by default:
# enable it under Actions > keep-warm (needs GitHub Actions minutes on the account), and disable it after judging.
name: keep-warm
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://claim-check-tr4f.onrender.com/healthz
